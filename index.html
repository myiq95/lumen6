그날의 빛은 유난히 느렸다. 창문을 통과한 햇살이 먼지 위를 떠다니며, 오래된 책상 위에 내려앉았다. 나는 그 빛을 손으로 잡으려 했지만, 빛은 손가락 사이로 빠져나갔다.

제1장 서재의 문

서재의 문은 언제나 약간 열려 있었다. 닫힌 적 없는 문처럼, 바람이 불 때마다 삐걱이는 소리를 냈다. 그 소리가 나는 싫지 않았다. 누군가 들어오는 소리 같았기 때문이다.

"거기 누구 있어요?"
아무도 대답하지 않았다. 하지만 책장 사이에서 종이 넘기는 소리가 들렸다.

— 누가 있는 거야?
나는 천천히 다가갔다. 책장 뒤에는 아무도 없었다. 다만 한 권의 책이 바닥에 떨어져 있었다.

제2장 첫 문장

책의 첫 문장은 이렇게 시작되었다.
"모든 이야기는 이미 끝난 뒤에 시작된다."

나는 그 문장을 세 번 읽었다. 끝나고 시작된다는 것이 무슨 의미일까. 끝이 있어야 시작이 있다는 말일까, 아니면 시작이 곧 끝이라는 말일까.

"이 문장, 당신이 쓴 거예요?"
옆에서 목소리가 들렸다. 돌아보니 아무도 없었다. 그러나 분명 누군가 물었다.

— 아니, 내가 쓴 게 아니야.
— 그럼 누가 썼는데?

나는 책을 덮었다. 표지에는 아무 이름도 없었다. 그저 검은 천으로 덮인 책이었다.

제3장 빛의 기록

빛은 기록된다. 눈에 보이지 않더라도, 벽에, 종이에, 마음에 남는다. 나는 그 기록을 읽는 법을 배우고 있었다.

어머니는 말했었다. 책을 읽을 때는 빛이 있는 쪽에 앉으라고. 그래서 나는 항상 창가에 앉았다. 오후 세 시의 빛이 가장 좋았다.

"오늘은 뭐 읽어?"
"모르겠어. 그냥 손에 잡히는 대로."

— 그래도 제목은 봐야지.
— 제목이 전부는 아니야.

대화가 이어졌다. 대화는 언제나 짧았고, 대답은 언제나 늦게 왔다.

제4장 남겨진 자리

서재에는 세 개의 의자가 있었다. 하나는 내가 앉는 의자, 하나는 아무도 앉지 않는 의자, 그리고 하나는 가끔 누군가 앉았다가 가는 의자.

그 의자들에 대해 생각했다. 의자는 사람이 있어야 의미가 있다. 비어 있는 의자는 기다림의 형태였다.

— 기다리는 게 힘들어?
— 아니, 기다림이 있어야 이야기가 생겨.

나는 창밖을 보았다. 밖에는 아무도 없었다. 하지만 기다림은 여전히 거기에 있었다.

에필로그 - 다시, 빛

모든 것을 읽은 뒤에도 빛은 남아 있었다. 책을 덮어도, 서재를 나와도, 빛은 손끝에 남아 있었다.

나는 깨달았다. 읽는다는 것은 빛을 손에 쥐는 일이 아니라, 빛이 지나간 자리를 기억하는 일이라는 것을.
