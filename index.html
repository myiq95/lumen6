제1장 - 빛이 머무는 자리

그는 오래된 서재의 창가에 서 있었다. 먼지가 내려앉은 책등 너머로 오후의 빛이 길게 들어오고 있었다.

"여기 있었구나."

그녀의 목소리는 바람처럼 가벼웠지만, 그에게는 오래 기다려온 문장처럼 들렸다.

제2장 - 종이의 기억

책장을 넘길 때마다 손끝에서 종이가 기억을 되짚었다. 잉크가 번진 자리마다 누군가의 시간이 박혀 있었다.

그는 첫 문장을 다시 읽었다. 같은 문장인데도 어제와 다른 뜻으로 읽혔다. 그것이 독서라는 것을 그는 이제야 알았다.

제3장 - 여백

우리는 종종 글자 사이의 여백을 놓친다. 하지만 이야기는 때로 여백에서 시작된다.

그는 책을 덮지 않았다. 덮는 순간 끝나버릴까 봐, 조금 더 그 자리에 머물기로 했다.

제4장 - 이어 읽기

아일랜드 바가 아래에 고정되어 있어야 이어 읽기가 무력화되지 않는다. 스크롤을 내릴 때는 사라지고, 올릴 때는 나타난다.

독자는 흐름을 잃지 않는다.

제5장 - 밤

밤이 되었다. 서재의 불빛만이 그의 어깨에 내려앉았다.
